<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .guest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    #loading {
      display: none;
      text-align: center;
      color: #666;
    }

    .lang-btn{
      float:right;
      margin-bottom:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="lang-btn">
    <button class="btn btn-sm btn-secondary" onclick="setLanguage('th')">TH</button>
    <button class="btn btn-sm btn-secondary" onclick="setLanguage('en')">EN</button>
  </div>

  <h2 id="title" class="text-center mb-4">ระบบเช็คชื่อแขก</h2>

  <div class="input-group mb-3">

    <input 
      type="text"
      id="newGuestName"
      class="form-control"
      placeholder="พิมพ์ชื่อแขก..."
    >

    <button id="addBtn" class="btn btn-primary" onclick="handleAdd()">
      เพิ่มชื่อ
    </button>

  </div>

  <input
    type="text"
    id="searchInput"
    class="form-control mb-3"
    placeholder="ค้นหารายชื่อ..."
    onkeyup="filterList()"
  >

  <hr>

  <div id="loading">
    กำลังโหลดข้อมูล...
  </div>

  <div id="guestList"></div>

</div>


<script>

window.onload = loadData;

var allGuests = [];
var currentLang = "th";


const dictionary = {

  th:{
    title:"ระบบเช็คชื่อแขก",
    add:"เพิ่มชื่อ",
    search:"ค้นหารายชื่อ...",
    input:"พิมพ์ชื่อแขก...",
    loading:"กำลังโหลดข้อมูล...",
    adding:"กำลังเพิ่ม...",
    deleting:"กำลังลบ...",
    empty:"ยังไม่มีรายชื่อ",
    delete:"ลบ",
    confirmDelete:"ต้องการลบคุณ "
  },

  en:{
    title:"Guest Check-in System",
    add:"Add",
    search:"Search guest...",
    input:"Enter guest name...",
    loading:"Loading...",
    adding:"Adding...",
    deleting:"Deleting...",
    empty:"No guests yet",
    delete:"Delete",
    confirmDelete:"Delete "
  }

};


/* เปลี่ยนภาษา */

function setLanguage(lang){

  currentLang = lang;

  document.getElementById("title").innerText =
  dictionary[lang].title;

  document.getElementById("addBtn").innerText =
  dictionary[lang].add;

  document.getElementById("searchInput").placeholder =
  dictionary[lang].search;

  document.getElementById("newGuestName").placeholder =
  dictionary[lang].input;

  document.getElementById("loading").innerText =
  dictionary[lang].loading;

  renderList(allGuests);
}



function loadData(){

  document.getElementById('loading').style.display = 'block';

  google.script.run
    .withSuccessHandler(showData)
    .getGuestList();
}



function showData(guests){

  document.getElementById('loading').style.display = 'none';

  allGuests = guests;

  renderList(allGuests);
}



function renderList(guests){

  var listDiv = document.getElementById('guestList');

  listDiv.innerHTML = '';

  if (guests.length === 0) {

    listDiv.innerHTML =
    '<p class="text-center text-muted">'+
    dictionary[currentLang].empty+
    '</p>';

    return;
  }

  guests.forEach(function(guest){

    var div = document.createElement('div');

    div.className = 'guest-item';

    div.innerHTML = `
      <span>${guest}</span>
      <button class="btn btn-sm btn-outline-danger"
        onclick="handleDelete('${guest}')">
        ${dictionary[currentLang].delete}
      </button>
    `;

    listDiv.appendChild(div);

  });

}



function handleAdd(){

  var input = document.getElementById('newGuestName');

  var name = input.value.trim();

  if (!name) return;

  input.value = '';

  document.getElementById('loading').style.display='block';

  document.getElementById('loading').innerText =
  dictionary[currentLang].adding;

  google.script.run
    .withSuccessHandler(loadData)
    .addGuest(name);

}



function handleDelete(name){

  if(!confirm(dictionary[currentLang].confirmDelete + name + '?'))
  return;

  document.getElementById('loading').style.display='block';

  document.getElementById('loading').innerText =
  dictionary[currentLang].deleting;

  google.script.run
    .withSuccessHandler(loadData)
    .deleteGuest(name);

}



function filterList(){

  var text =
  document.getElementById('searchInput')
  .value
  .toLowerCase();

  var filtered = allGuests.filter(function(g){

    return g.toLowerCase().includes(text);

  });

  renderList(filtered);

}

</script>

</body>
</html>
